name: Artha AI Compliance & Security CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  audit-and-eval:
    name: Security SAST, Bias Audit & Pytest Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit

      - name: Run Bandit Security SAST Analysis
        run: |
          bandit -r app/ -ll --skip B105,B106

      - name: Run Threshold Analysis & Bias Audit
        run: |
          python3 scripts/threshold_analysis.py
          python3 scripts/bias_audit.py

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Run Data Drift Gate Analysis
        run: |
          python3 scripts/drift_check.py

