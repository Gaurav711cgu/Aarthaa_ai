[lint]
select = ["E", "F", "W", "BLE"]
ignore = [
    "E402",   # module level import not at top of file (needed for sys.modules shim)
    "E501",   # line too long
    "E701",   # multiple statements on one line
    "E741",   # ambiguous variable name
    "F821",   # undefined name (gradio/evidently dynamic imports)
    "F841",   # local variable assigned but never used
    "W291",   # trailing whitespace
    "W293",   # blank line contains whitespace
]
